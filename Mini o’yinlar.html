<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QUQU GAMES - LANGAR</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --accent: #ff7b00;
      --accent-blue: #00bcd4;
      --text: #ffffff;
      --text-muted: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    
    header { width: 100%; padding: 20px; display: flex; flex-direction: column; align-items: center; background: #090d12; border-bottom: 1px solid #30363d; }
    .logo-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .logo { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
    h1 { font-size: 24px; letter-spacing: 2px; color: var(--accent-blue); text-transform: uppercase; }
    
    .container { width: 100%; max-width: 600px; padding: 20px; flex: 1; }
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); } }

    .game-card { background: var(--card-bg); border: 1px solid #30363d; border-radius: 12px; padding: 15px; cursor: pointer; transition: all 0.2s ease; display: flex; flex-direction: column; justify-content: center; }
    .game-card:hover { transform: translateY(-3px); border-color: var(--accent); background: #1f242c; }
    .game-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; color: var(--text); }
    .game-desc { font-size: 13px; color: var(--text-muted); }

    #game-view { display: none; width: 100%; max-width: 400px; padding: 20px; text-align: center; flex: 1; flex-direction: column; align-items: center; justify-content: center; }
    .back-btn { margin-bottom: 15px; padding: 8px 16px; background: #21262d; color: var(--text); border: 1px solid #30363d; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .back-btn:hover { background: #30363d; }

    canvas { background: #000; border: 2px solid #30363d; border-radius: 8px; max-width: 100%; }
    
    /* Umumiy elementlar */
    .ui-box { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid #30363d; width: 100%; }
    button.action-btn { margin-top: 10px; padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    button.action-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <img class="logo" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=" alt="QUQU GAMES Logo">
      <div>
        <h1>QUQU GAMES</h1>
        <p style="font-size: 12px; color: var(--text-muted); text-align: center;">— LANGAR —[cite: 2]</p>
      </div>
    </div>
  </header>

  <div class="container" id="menu-view">
    <div class="grid" id="game-list"></div>
  </div>

  <div id="game-view">
    <button class="back-btn" onclick="goBack()">⬅ Orqaga</button>
    <h2 id="current-game-title" style="margin-bottom: 10px;"></h2>
    <div id="game-content" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>
  </div>

  <script>
    const games = [
      { id: 'penalti', name: 'Penalti', desc: 'Darvozaning istalgan joyiga bosing, 5 ta zarba', init: initPenalti },
      { id: 'otishma', name: 'Otishma', desc: 'Barmoq bilan suring, o`q avtomatik uchadi', init: initOtishma },
      { id: 'ilon', name: 'Ilon', desc: 'Barmoq bilan suring yoki strelkalar', init: initIlon },
      { id: 'uchish', name: 'Uchish', desc: 'Bosganingizda qush ko`tariladi, quvurlardan o`ting', init: initUchish },
      { id: 'tezbos', name: 'Tez bos', desc: '30 soniyada iloji boricha ko`p nishonni bosing', init: initTezBos },
      { id: 'gisht', name: 'G`isht sindirish', desc: 'Taxtani suring, to`p bilan hamma g`ishtni sindiring', init: initGisht },
      { id: 'poyga', name: 'Poyga', desc: 'Mashinani suring, qarshidagilardan qoching', init: initPoyga },
      { id: 'xotira', name: 'Xotira', desc: 'Bir xil rasmli kartalar juftini toping', init: initXotira },
      { id: 'tosh', name: 'Tosh-qaychi-qog`oz', desc: 'Kompyuterga qarshi o`ynang', init: initTosh },
      { id: 'runner', name: '3D Yugurish', desc: 'Chap yoki o`ng tomonni bosing, to`siqlardan qoching', init: initRunner }
    ];

    const menuView = document.getElementById('menu-view');
    const gameView = document.getElementById('game-view');
    const gameList = document.getElementById('game-list');
    const currentGameTitle = document.getElementById('current-game-title');
    const gameContent = document.getElementById('game-content');
    let currentGameCleanup = null;

    function renderMenu() {
      gameList.innerHTML = '';
      games.forEach(g => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.innerHTML = `<div class="game-title">${g.name}</div><div class="game-desc">${g.desc}</div>`;
        card.onclick = () => loadGame(g);
        gameList.appendChild(card);
      });
    }

    function loadGame(game) {
      menuView.style.display = 'none';
      gameView.style.display = 'flex';
      currentGameTitle.textContent = game.name;
      gameContent.innerHTML = '';
      if(currentGameCleanup) { currentGameCleanup(); currentGameCleanup = null; }
      game.init();
    }

    function goBack() {
      if(currentGameCleanup) { currentGameCleanup(); currentGameCleanup = null; }
      gameView.style.display = 'none';
      menuView.style.display = 'block';
    }

    renderMenu();

    // 1. PENALTI
    function initPenalti() {
      gameContent.innerHTML = `
        <div id="p-container" style="position:relative; width:300px; height:350px; background:#1e4620; border:3px solid #fff; border-radius:8px; overflow:hidden; cursor:pointer;">
          <div style="position:absolute; top:15px; left:40px; width:220px; height:100px; border:5px solid #fff; border-bottom:none;"></div>
          <div id="p-keeper" style="position:absolute; top:80px; left:125px; width:50px; height:25px; background:#e53e3e; border-radius:4px; transition:all 0.2s;"></div>
          <div id="p-ball" style="position:absolute; bottom:20px; left:135px; width:30px; height:30px; background:#fff; border-radius:50%; transition:all 0.4s;"></div>
        </div>
        <p style="margin-top:10px;">Urinish: <span id="p-shots">0</span>/5 | Gollar: <span id="p-goals">0</span></p>
        <p id="p-msg" style="color:var(--accent-blue); font-size:14px; margin-top:5px;">Darvozani bosing!</p>
      `;
      let shots = 0, goals = 0, shooting = false;
      const c = document.getElementById('p-container');
      const ball = document.getElementById('p-ball');
      const keeper = document.getElementById('p-keeper');
      const sEl = document.getElementById('p-shots');
      const gEl = document.getElementById('p-goals');
      const mEl = document.getElementById('p-msg');

      function onClick(e) {
        if(shots >= 5 || shooting) return;
        const rect = c.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        if(y > 180) return;

        shooting = true;
        shots++;
        sEl.textContent = shots;
        ball.style.left = (x - 15) + 'px';
        ball.style.top = (y - 15) + 'px';

        const kPos = [50, 125, 200];
        const rK = kPos[Math.floor(Math.random()*3)];
        keeper.style.left = rK + 'px';

        setTimeout(() => {
          let hit = Math.abs(x - (rK + 25)) < 30;
          let inGoal = x >= 40 && x <= 260 && y >= 15 && y <= 115;
          if(inGoal && !hit) { goals++; gEl.textContent = goals; mEl.textContent = "GOL! 🎉"; }
          else { mEl.textContent = "Qaytarildi! ❌"; }

          setTimeout(() => {
            if(shots < 5) {
              ball.style.top = '300px'; ball.style.left = '135px';
              keeper.style.left = '125px'; shooting = false;
            } else { mEl.textContent = `O'yin tugadi! Jami gollar: ${goals}`; }
          }, 800);
        }, 400);
      }
      c.addEventListener('click', onClick);
      currentGameCleanup = () => c.removeEventListener('click', onClick);
    }

    // 2. OTISHMA
    function initOtishma() {
      gameContent.innerHTML = `<canvas id="c-otishma" width="300" height="380"></canvas>`;
      const cv = document.getElementById('c-otishma');
      const ctx = cv.getContext('2d');
      let p = {x: 130, y: 340, w: 40, h: 20};
      let bullets = [], enemies = [], score = 0, over = false;

      function onMM(e) { const r = cv.getBoundingClientRect(); p.x = e.clientX - r.left - p.w/2; }
      function onTM(e) { const r = cv.getBoundingClientRect(); p.x = e.touches[0].clientX - r.left - p.w/2; }
      cv.addEventListener('mousemove', onMM);
      cv.addEventListener('touchmove', onTM);

      let t1 = setInterval(() => { if(!over) bullets.push({x: p.x+18, y: p.y, w: 4, h: 10}); }, 250);
      let t2 = setInterval(() => { if(!over) enemies.push({x: Math.random()*260, y: -20, w: 30, h: 20}); }, 800);
      let req;

      function loop() {
        if(!over) {
          ctx.clearRect(0,0,cv.width,cv.height);
          bullets.forEach((b,i) => { b.y -= 6; if(b.y < 0) bullets.splice(i,1); });
          enemies.forEach((en,ei) => {
            en.y += 2;
            if(en.y > cv.height) over = true;
            bullets.forEach((b,bi) => {
              if(b.x < en.x+en.w && b.x+b.w > en.x && b.y < en.y+en.h && b.y+b.h > en.y) {
                enemies.splice(ei,1); bullets.splice(bi,1); score += 10;
              }
            });
          });

          ctx.fillStyle = '#00bcd4'; ctx.fillRect(p.x, p.y, p.w, p.h);
          ctx.fillStyle = '#ff7b00'; bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));
          ctx.fillStyle = '#e53e3e'; enemies.forEach(en => ctx.fillRect(en.x, en.y, en.w, en.h));
          ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText('Hisob: ' + score, 10, 20);
          req = requestAnimationFrame(loop);
        } else {
          ctx.fillStyle = '#e53e3e'; ctx.font = '20px sans-serif'; ctx.fillText('O\'YIN TUGADI', 90, 190);
        }
      }
      loop();
      currentGameCleanup = () => { clearInterval(t1); clearInterval(t2); cancelAnimationFrame(req); };
    }

    // 3. ILON
    function initIlon() {
      gameContent.innerHTML = `
        <canvas id="c-ilon" width="280" height="280"></canvas>
        <div style="margin-top:10px; display:flex; gap:10px;">
          <button class="action-btn" onclick="window.setSnakeDir(0,-1)">⬆️</button>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="action-btn" onclick="window.setSnakeDir(-1,0)">⬅️</button>
          <button class="action-btn" onclick="window.setSnakeDir(0,1)">⬇️</button>
          <button class="action-btn" onclick="window.setSnakeDir(1,0)">➡️</button>
        </div>
      `;
      const cv = document.getElementById('c-ilon');
      const ctx = cv.getContext('2d');
      const grid = 14;
      let snake = [{x: 140, y: 140}];
      let dx = grid, dy = 0;
      let food = {x: 56, y: 56};
      let score = 0, active = true;

      window.setSnakeDir = (x, y) => {
        if(x !== 0 && dx === 0) { dx = x * grid; dy = 0; }
        if(y !== 0 && dy === 0) { dx = 0; dy = y * grid; }
      };

      function onKey(e) {
        if(e.key === 'ArrowLeft' && dx === 0) { dx = -grid; dy = 0; }
        if(e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -grid; }
        if(e.key === 'ArrowRight' && dx === 0) { dx = grid; dy = 0; }
        if(e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = grid; }
      }
      window.addEventListener('keydown', onKey);

      let t = setInterval(() => {
        if(!active) return;
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,cv.width,cv.height);
        
        const head = {x: snake[0].x + dx, y: snake[0].y + dy};
        if(head.x < 0 || head.x >= cv.width || head.y < 0 || head.y >= cv.height || snake.some(s => s.x === head.x && s.y === head.y)) {
          active = false; alert('O\'yin tugadi! Hisob: ' + score); return;
        }
        snake.unshift(head);
        if(head.x === food.x && head.y === food.y) {
          score += 10;
          food.x = Math.floor(Math.random()*(cv.width/grid))*grid;
          food.y = Math.floor(Math.random()*(cv.height/grid))*grid;
        } else { snake.pop(); }

        ctx.fillStyle = '#e53e3e'; ctx.fillRect(food.x, food.y, grid-2, grid-2);
        ctx.fillStyle = '#48bb78'; snake.forEach(s => ctx.fillRect(s.x, s.y, grid-2, grid-2));
      }, 120);

      currentGameCleanup = () => { clearInterval(t); window.removeEventListener('keydown', onKey); delete window.setSnakeDir; };
    }

    // 4. UCHISH
    function initUchish() {
      gameContent.innerHTML = `<canvas id="c-uchish" width="280" height="360"></canvas><p style="font-size:12px; margin-top:5px;">Ekranga bosing</p>`;
      const cv = document.getElementById('c-uchish');
      const ctx = cv.getContext('2d');
      let bird = {x: 50, y: 150, w: 18, h: 18, gravity: 0.5, lift: -8, v: 0};
      let pipes = [], frame = 0, score = 0, over = false, req;

      function jump() { if(!over) bird.v = bird.lift; }
      cv.addEventListener('click', jump);
      cv.addEventListener('touchstart', jump);

      function loop() {
        frame++;
        bird.v += bird.gravity; bird.y += bird.v;
        if(frame % 90 === 0) {
          let gap = 90, topH = Math.floor(Math.random() * 150) + 30;
          pipes.push({x: cv.width, top: topH, bot: cv.height - topH - gap});
        }

        ctx.fillStyle = '#00bcd4'; ctx.fillRect(0,0,cv.width,cv.height);
        ctx.fillStyle = '#ff7b00'; ctx.fillRect(bird.x, bird.y, bird.w, bird.h);

        ctx.fillStyle = '#38a169';
        pipes.forEach((p, i) => {
          p.x -= 2;
          ctx.fillRect(p.x, 0, 35, p.top);
          ctx.fillRect(p.x, cv.height - p.bot, 35, p.bot);
          if(bird.x < p.x + 35 && bird.x + bird.w > p.x && (bird.y < p.top || bird.y + bird.h > cv.height - p.bot)) over = true;
          if(p.x === 50) score++;
        });

        if(bird.y > cv.height || bird.y < 0) over = true;
        ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif'; ctx.fillText('Hisob: ' + score, 10, 20);

        if(!over) req = requestAnimationFrame(loop);
        else ctx.fillText('TUGADI', 110, 180);
      }
      loop();
      currentGameCleanup = () => cancelAnimationFrame(req);
    }

    // 5. TEZ BOS
    function initTezBos() {
      gameContent.innerHTML = `
        <div class="ui-box" style="height:300px; position:relative; overflow:hidden;" id="tb-box">
          <div id="tb-target" style="position:absolute; width:40px; height:40px; background:var(--accent); border-radius:50%; cursor:pointer; display:none;"></div>
        </div>
        <p style="margin-top:10px;">Vaqt: <span id="tb-time">30</span>s | Hisob: <span id="tb-score">0</span></p>
        <button class="action-btn" onclick="window.startTezBos()">Boshlash</button>
      `;
      let score = 0, time = 30, timer;
      const target = document.getElementById('tb-target');
      const box = document.getElementById('tb-box');

      window.startTezBos = () => {
        score = 0; time = 30;
        document.getElementById('tb-score').textContent = score;
        document.getElementById('tb-time').textContent = time;
        target.style.display = 'block';
        moveT();
        clearInterval(timer);
        timer = setInterval(() => {
          time--;
          document.getElementById('tb-time').textContent = time;
          if(time <= 0) { clearInterval(timer); target.style.display = 'none'; alert('Vaqt tugadi! Hisob: ' + score); }
        }, 1000);
      };

      function moveT() {
        const x = Math.floor(Math.random() * 220);
        const y = Math.floor(Math.random() * 240);
        target.style.left = x + 'px'; target.style.top = y + 'px';
      }
      target.onclick = () => { score++; document.getElementById('tb-score').textContent = score; moveT(); };
      currentGameCleanup = () => { clearInterval(timer); delete window.startTezBos; };
    }

    // 6. G'ISHT SINDIRISH
    function initGisht() {
      gameContent.innerHTML = `<canvas id="c-gisht" width="280" height="340"></canvas>`;
      const cv = document.getElementById('c-gisht');
      const ctx = cv.getContext('2d');
      let x = 140, y = 280, dx = 2, dy = -2, r = 7;
      let pW = 60, pH = 10, pX = 110;
      let bricks = [];
      for(let c=0; c<4; c++) {
        bricks[c] = [];
        for(let row=0; row<3; row++) bricks[c][row] = {x:0, y:0, status:1};
      }

      function onMM(e) {
        let rx = e.clientX - cv.getBoundingClientRect().left;
        if(rx > 0 && rx < cv.width) pX = rx - pW/2;
      }
      cv.addEventListener('mousemove', onMM);
      let req;

      function loop() {
        ctx.clearRect(0,0,cv.width,cv.height);
        for(let c=0; c<4; c++) {
          for(let row=0; row<3; row++) {
            let b = bricks[c][row];
            if(b.status === 1) {
              let bx = c * 62 + 20, by = row * 20 + 25;
              b.x = bx; b.y = by;
              ctx.fillStyle = '#e53e3e'; ctx.fillRect(bx, by, 50, 14);
              if(x > bx && x < bx+50 && y > by && y < by+14) { dy = -dy; b.status = 0; }
            }
          }
        }

        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill(); ctx.closePath();
        ctx.fillStyle = '#00bcd4'; ctx.fillRect(pX, cv.height-pH, pW, pH);

        if(x + dx > cv.width - r || x + dx < r) dx = -dx;
        if(y + dy < r) dy = -dy;
        else if(y + dy > cv.height - r) {
          if(x > pX && x < pX + pW) dy = -dy;
          else { alert('O\'yin tugadi!'); x=140; y=280; }
        }
        x += dx; y += dy;
        req = requestAnimationFrame(loop);
      }
      loop();
      currentGameCleanup = () => cancelAnimationFrame(req);
    }

    // 7. POYGA
    function initPoyga() {
      gameContent.innerHTML = `<canvas id="c-poyga" width="240" height="340"></canvas>`;
      const cv = document.getElementById('c-poyga');
      const ctx = cv.getContext('2d');
      let pX = 100, enY = -80, enX = 100, score = 0, req;

      function onKey(e) {
        if(e.key === 'ArrowLeft' && pX > 40) pX -= 80;
        if(e.key === 'ArrowRight' && pX < 160) pX += 80;
      }
      window.addEventListener('keydown', onKey);

      function loop() {
        enY += 4;
        if(enY > cv.height) { enY = -80; enX = Math.random() < 0.5 ? 40 : 120; score++; }
        if(enY > 240 && pX === enX) { alert('To\'qnashuv! Hisob: ' + score); enY = -80; score = 0; }

        ctx.clearRect(0,0,cv.width,cv.height);
        ctx.fillStyle = '#fff'; ctx.fillRect(115, 0, 10, cv.height);
        ctx.fillStyle = '#00bcd4'; ctx.fillRect(pX, 260, 35, 55);
        ctx.fillStyle = '#e53e3e'; ctx.fillRect(enX, enY, 35, 55);
        ctx.fillStyle = '#fff'; ctx.fillText('Hisob: ' + score, 10, 20);

        req = requestAnimationFrame(loop);
      }
      loop();
      currentGameCleanup = () => { cancelAnimationFrame(req); window.removeEventListener('keydown', onKey); };
    }

    // 8. XOTIRA
    function initXotira() {
      gameContent.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(4, 55px); gap:8px; justify-content:center;" id="x-grid"></div>
      `;
      const icons = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍓', '🍓'];
      icons.sort(() => 0.5 - Math.random());
      const grid = document.getElementById('x-grid');
      let selected = [];

      icons.forEach((ic) => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.style.cssText = 'width:55px; height:55px; background:#21262d; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; padding:0;';
        card.dataset.icon = ic;
        card.onclick = () => {
          if(selected.length < 2 && !card.classList.contains('flipped') && !card.classList.contains('matched')) {
            card.textContent = ic; card.classList.add('flipped');
            selected.push(card);
            if(selected.length === 2) {
              setTimeout(() => {
                if(selected[0].dataset.icon === selected[1].dataset.icon) {
                  selected[0].classList.add('matched'); selected[1].classList.add('matched');
                  selected[0].style.background = '#238636'; selected[1].style.background = '#238636';
                } else {
                  selected[0].textContent = ''; selected[1].textContent = '';
                  selected[0].classList.remove('flipped'); selected[1].classList.remove('flipped');
                }
                selected = [];
              }, 400);
            }
          }
        };
        grid.appendChild(card);
      });
    }

    // 9. TOSH QAYCHI QOG'OZ
    function initTosh() {
      gameContent.innerHTML = `
        <div style="margin:20px 0;">
          <button class="action-btn" onclick="window.playTosh('✊')">✊ Tosh</button>
          <button class="action-btn" onclick="window.playTosh('✌️')">✌️ Qaychi</button>
          <button class="action-btn" onclick="window.playTosh('✋')">✋ Qog'oz</button>
        </div>
        <div id="tosh-res" style="font-size:16px; margin-top:15px;">Tanlang!</div>
      `;
      window.playTosh = (player) => {
        const opts = ['✊', '✌️', '✋'];
        const bot = opts[Math.floor(Math.random() * 3)];
        let res = '';
        if(player === bot) res = "Durang! 🤝";
        else if((player==='✊'&&bot==='✌️') || (player==='✌️'&&bot==='✋') || (player==='✋'&&bot==='✊')) res = "Siz yutdingiz! 🎉";
        else res = "Kompyuter yutdi! 🤖";
        document.getElementById('tosh-res').innerHTML = `Siz: ${player} | Bot: ${bot}<br><br><b>${res}</b>`;
      };
      currentGameCleanup = () => delete window.playTosh;
    }

    // 10. 3D YUGURISH
    function initRunner() {
      gameContent.innerHTML = `
        <canvas id="c-runner" width="260" height="340"></canvas>
        <p style="font-size:12px; margin-top:5px;">Chap yoki o'ng tomonni bosing</p>
      `;
      const cv = document.getElementById('c-runner');
      const ctx = cv.getContext('2d');
      let pLane = 1;
      const lanes = [65, 130, 195];
      let obs = [], score = 0, req;

      cv.addEventListener('click', e => {
        let x = e.clientX - cv.getBoundingClientRect().left;
        if(x < cv.width/2 && pLane > 0) pLane--;
        else if(x >= cv.width/2 && pLane < 2) pLane++;
      });

      let t = setInterval(() => {
        obs.push({lane: Math.floor(Math.random()*3), y: 0, size: 10});
      }, 900);

      function loop() {
        ctx.clearRect(0,0,cv.width,cv.height);
        ctx.strokeStyle = '#30363d';
        ctx.beginPath();
        ctx.moveTo(90,0); ctx.lineTo(20,340);
        ctx.moveTo(170,0); ctx.lineTo(240,340);
        ctx.stroke();

        obs.forEach((o, i) => {
          o.y += 3; o.size += 0.4;
          let x = lanes[o.lane];
          ctx.fillStyle = '#e53e3e'; ctx.fillRect(x - o.size/2, o.y, o.size, o.size);
          if(o.y > 270 && o.y < 310 && o.lane === pLane) {
            alert('To\'siqqa urildingiz! Hisob: ' + score);
            obs = []; score = 0;
          }
          if(o.y > 340) { obs.splice(i,1); score++; }
        });

        ctx.fillStyle = '#48bb78'; ctx.fillRect(lanes[pLane]-15, 280, 30, 30);
        ctx.fillStyle = '#fff'; ctx.fillText('Hisob: ' + score, 10, 20);
        req = requestAnimationFrame(loop);
      }
      loop();
      currentGameCleanup = () => { clearInterval(t); cancelAnimationFrame(req); };
    }
  </script>
</body>
</html>
